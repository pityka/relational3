name: Release
on:
  push:
    tags: ["v*"]
jobs:

  publish-ghp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - name: Publish to GitHub Packages
        run: |
          sbt 'set ThisBuild / publishTo := Some("GitHub Packages" at "https://maven.pkg.github.com/pityka/relational3")' \
              +publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

